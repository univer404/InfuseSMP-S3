name: Build InfuseSMP-S3

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.java'
      - '**.yml'
      - '**.py'
      - 'resource-pack-26.3/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: InfuseSMP-S3-${{ github.ref_name == 'develop' && 'Development' || 'Build' }}-${{ github.run_number }}
          path: target/InfuseSMP-S3-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Java 26.3 resource packs
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python resource-pack-26.3/build_pack.py

      - name: Upload resource packs
        uses: actions/upload-artifact@v4
        with:
          name: InfuseSMP-S3-ResourcePacks-${{ github.run_number }}
          path: |
            target/InfuseSMP-S3-ResourcePack-26.3.zip
            target/InfuseSMP-S3-ResourcePack-Java-1.21-1.21.8.zip
            target/InfuseSMP-S3-ResourcePack-Java-1.21.9-1.21.11.zip
          if-no-files-found: error
          retention-days: 30
