name: Build InfuseSMP-S3
on:
  push:
    branches: [main, 'conversion/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: InfuseSMP-S3-${{ github.run_number }}
          path: target/InfuseSMP-S3-*.jar
          if-no-files-found: error
          retention-days: 30
