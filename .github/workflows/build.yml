name: Build InfuseSMP-S3
on:
  push:
    branches:
      - 'conversion/**'
      - 'development/**'
  pull_request:
    paths:
      - '**.java'
      - '**.yml'
      - '**.py'
      - 'resource-pack-26.3/**'
      - 'pom.xml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/conversion/') || startsWith(github.ref, 'refs/heads/development/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/heads/development/') && 'InfuseSMP-S3-DEV' || 'InfuseSMP-S3' }}-${{ github.run_number }}
          path: target/InfuseSMP-S3-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Build Java 26.3 resource pack
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python resource-pack-26.3/build_pack.py
      - name: Upload resource packs
        uses: actions/upload-artifact@v4
        with:
          name: InfuseSMP-S3-ResourcePacks-${{ github.run_number }}
          path: |
            target/InfuseSMP-S3-ResourcePack-26.3.zip
            target/InfuseSMP-S3-ResourcePack-Java-1.21-1.21.8.zip
            target/InfuseSMP-S3-ResourcePack-Java-1.21.9-1.21.11.zip
          if-no-files-found: error
          retention-days: 30
