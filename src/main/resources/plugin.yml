name: InfuseSMP-S3
version: 1.0.0
main: com.universe404.infusesmp.InfuseSMP
api-version: '1.21.11'
softdepend: [PlaceholderAPI, WorldGuard]
authors: [univer404]
description: Java conversion of the Infuse S3 Skript.
commands:
  infuse:
    description: Manage Infuse effects.
    usage: /infuse <add|remove|get|history|toggle>
    permission: infuse.command
  bind:
    description: Bind an Infuse slot activation.
    aliases: [controls, controlset, control]
  toggledisplay:
    description: Toggle Infuse item display style.
    aliases: [display, toggleicon, simpleicon]
  activate:
    description: Activate an Infuse slot.
    aliases: [u, use, a]
  swap:
    description: Swap primary and secondary effects.
    aliases: [swapeff, swapeffects, swapslots]
  trust:
    description: Manage trusted players.
    aliases: [t]
  ldrain:
    description: Drain the primary effect.
    aliases: [pdrain]
  rdrain:
    description: Drain the secondary effect.
    aliases: [sdrain]
  conf:
    description: Read or change supported configuration.
  recipes:
    description: View Infuse crafting recipes.
  resetcooldown:
    description: Reset Infuse spark cooldowns.
    aliases: [rscd, rcd, rscooldown]
    permission: infuse.admin
  resetcraft:
    description: Reset ritual crafting tallies.
    aliases: [rscraft]
    permission: infuse.admin
  mapregion:
    description: Map WorldGuard regions where Infuse effects are disabled.
    permission: infuse.admin
  item:
    description: Give Infuse custom items.
    aliases: [giveitem, i, potion, pot]
    permission: infuse.admin
permissions:
  infuse.command:
    default: true
  infuse.admin:
    default: op
