# Infuse S3 settings; values are read by the plugin.
allow_same_effects: false
trust_list_max: 3
trust_list_delay_seconds: 10
allow_true_damage: true
roll_first_join: false
do_roll_animation: true
head_drop: false
lock_effects: false
overwrite_enchants: true
charged_refresh_speed: 15
recharge_sound: BLOCK_BEACON_POWER_SELECT
use_sound: BLOCK_BEACON_ACTIVATE
disabled_worlds: [disabled_world]
ritual_duration_seconds: 600
primary_effects: [heart, strength, regeneration, haste, invisibility, frost, thunder, feather]
secondary_effects: [speed, fire, ocean, emerald]
effects:
  emerald: {enabled: true, cooldown_seconds: 30, spark_seconds: 10, trigger_hits: 10, spark_xp_gain: 2, craft_limit: -1, augment_limit: 0}
  feather: {enabled: true, cooldown_seconds: 40, spark_seconds: 5, craft_limit: -1, augment_limit: 0}
  fire: {enabled: true, cooldown_seconds: 90, spark_seconds: 4, trigger_hits: 5, ignite_radius: 6, ignite_duration_ticks: 200, craft_limit: -1, augment_limit: 0}
  frost: {enabled: true, cooldown_seconds: 60, spark_seconds: 10, trigger_hits: 10, craft_limit: -1, augment_limit: 0}
  haste: {enabled: true, cooldown_seconds: 60, spark_seconds: 15, craft_limit: -1, augment_limit: 0}
  heart: {enabled: true, cooldown_seconds: 120, spark_seconds: 60, passive_hearts: 15, spark_hearts: 20, craft_limit: -1, augment_limit: 0}
  invisibility: {enabled: true, cooldown_seconds: 90, spark_seconds: 10, craft_limit: -1, augment_limit: 0}
  ocean: {enabled: true, cooldown_seconds: 90, spark_seconds: 5, craft_limit: -1, augment_limit: 0}
  regeneration: {enabled: true, cooldown_seconds: 60, spark_seconds: 15, craft_limit: -1, augment_limit: 0}
  speed: {enabled: true, cooldown_seconds: 20, spark_seconds: 1, multiplier: 0.2, craft_limit: -1, augment_limit: 0}
  strength: {enabled: true, cooldown_seconds: 60, spark_seconds: 15, mob_damage: 2, craft_limit: -1, augment_limit: 0}
  thunder: {enabled: true, cooldown_seconds: 90, spark_seconds: 10, trigger_hits: 10, true_damage: 1, craft_limit: -1, augment_limit: 0}
  ender: {enabled: true, cooldown_seconds: 30, spark_seconds: 1, craft_limit: 1, augment_limit: 1}
  earth: {enabled: true, cooldown_seconds: 60, spark_seconds: 10, craft_limit: 1, augment_limit: 1}
