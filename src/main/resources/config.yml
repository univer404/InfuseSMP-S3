# Paid release licensing (BuiltByBit V2 Embed API)
# Create a shareable API token with ONLY the resources.embed.latest scope.
# Set the token before publishing the final JAR. Never use a token with other scopes.
license:
  enabled: true
  api-token: "PUT_SHAREABLE_TOKEN_HERE"

# General behavior and effect tuning
allow_same_effects: false
trust_list_max: 3
trust_list_delay_seconds: 10
roll_first_join: false
do_roll_animation: true
head_drop: false
lock_effects: false
overwrite_enchants: true
recharge_sound: "custom.health"
use_sound: "custom.activate"
disabled_worlds: [disabled_world]
ritual_enabled: true
ritual_duration_seconds: 600
primary_effects: [heart, strength, regeneration, haste, invisibility, frost, thunder, feather]
secondary_effects: [speed, fire, ocean, emerald]
# Effect settings
# Each effect below has its own settings. Keep the effect names unchanged.
# Common settings:
#   enabled: turns the effect on or off.
#   cooldown_seconds: wait time after activating its spark.
#   spark_seconds: how long the spark ability lasts.
#   trigger_hits: number of successful hits needed to trigger hit-based effects.
#   craft_limit: maximum normal crafts; -1 means unlimited.
#   augment_limit: maximum augmented crafts; -1 means unlimited.
# Time values ending in _seconds are seconds; values ending in _ticks are Minecraft ticks (20 ticks = 1 second).
# Values ending in _radius or _range are measured in blocks unless otherwise noted.
# The remaining options tune only the named effect and should normally be left at their defaults.
effects:
  # Emerald effect settings
  emerald:
    enabled: true
    cooldown_seconds: 30
    spark_seconds: 10
    trigger_hits: 10
    xp_gain: 1
    spark_xp_gain: 2
    no_consume_chance: 0.5
    spark_no_consume_chance: 0.75
    craft_limit: -1
    augment_limit: 0
